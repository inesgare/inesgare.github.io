<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} – {{ site.title }}</title>
  <link rel="stylesheet" href="/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

  {% include nav.html %}  <!-- optional reusable nav -->

  {% if page.url == "/" %}
  <!-- Homepage layout: profile block on left, content on right -->
  <div class="main-page-layout">

    <!-- Profile Block -->
    <div class="profile-block">
      <img src="profile.jpg" alt="Inés García-Redondo" class="profile-photo">

      <div class="profile-info">
        <h1>Inés García-Redondo</h1>
        <p class="title">Postdoctoral Researcher, <a href="https://aidos.group/">AIDOS Lab</a>, University of Fribourg</p>

        <div class="contact-links">
          <a href="/docs/cv.pdf">CV</a>
          <a href="mailto:ines.garciaredondo@unifr.ch">Email</a>
          <a href="https://orcid.org/0000-0001-8340-4235">ORCID</a>
          <a href="https://scholar.google.com">Scholar</a>
          <a href="https://github.com/inesgare">GitHub</a>
          <a href="https://www.linkedin.com/in/ines-garcia-redondo/">LinkedIn</a>
        </div>
      </div>
    </div>

    <!-- Main content -->
    <div class="main-content">
      {{ content }}
    </div>

  </div>
  {% else %}
  <!-- Other pages: just display the content -->
  <div class="main-content">
    {{ content }}
  </div>
  {% endif %}

  <footer>
    Last updated: {{ site.time | date: "%B %Y" }}
  </footer>
</div>

</body>
</html>
